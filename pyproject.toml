[project]
name = "oslo-bysykkel-forecast"
version = "0.1.0"
description = "Predicts available bikes and docks at Oslo Bysykkel stations 15, 30 and 60 minutes ahead."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]